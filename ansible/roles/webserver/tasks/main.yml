---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Remove default nginx site (sites-enabled)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Create /var/www/html/ directory
  ansible.builtin.file:
    path: /var/www/html
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Deploy index.html from template
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: '0644'

- name: Create /var/www/html/health/ directory
  ansible.builtin.file:
    path: /var/www/html/health
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Deploy health check page
  ansible.builtin.copy:
    content: '{"status":"UP","server":"{{ inventory_hostname }}","role":"webserver"}'
    dest: /var/www/html/health/index.html
    owner: www-data
    group: www-data
    mode: '0644'

- name: Deploy nginx vhost config from template
  ansible.builtin.template:
    src: nginx-site.conf.j2
    dest: /etc/nginx/conf.d/webserver.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx

- name: Remove default nginx site (sites-available)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Validate nginx config
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
