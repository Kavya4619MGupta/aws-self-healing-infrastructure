---
- name: Set timezone
  community.general.timezone:
    name: "{{ system_timezone }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - vim
      - htop
      - net-tools
      - ufw
      - python3
      - python3-pip
      - unzip
    state: present

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny
  when: ufw_enabled | bool

- name: Allow SSH via UFW
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
  when: ufw_enabled | bool

- name: Set UFW logging
  community.general.ufw:
    logging: 'on'
  when: ufw_enabled | bool
