---
- name: Set timezone
  ansible.builtin.command: "timedatectl set-timezone {{ system_timezone | default('UTC') }}"
  changed_when: false

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - vim
      - htop
      - net-tools
      - ufw
      - chrony
      - python3
      - unzip
    state: present

- name: Ensure chrony service is running
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Allow SSH via UFW
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
  when: ufw_enabled | default(true) | bool

- name: Allow HTTP via UFW
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp
  when: ufw_enabled | default(true) | bool

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny
  when: ufw_enabled | default(true) | bool
